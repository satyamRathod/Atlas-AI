services:
  qdrant:
    image: qdrant/qdrant:latest

    container_name: atlas-qdrant

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - ./docker/qdrant:/qdrant/storage

# Redis is expected to run independently of this compose file (see
# `apps/api/src/config/.env.example` for `REDIS_URL`) — it's a shared
# instance also used by other local projects, not something this repo
# provisions or owns.